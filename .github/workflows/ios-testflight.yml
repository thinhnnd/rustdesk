# Build the iOS/iPadOS IPA and upload it to TestFlight.
#
# Fast path: this branch ships a prebuilt Rust core at
# `prebuilt/ios/liblibrustdesk.a.gz` (see run_ios.sh), so the pipeline does NOT
# run vcpkg/cargo/flutter_rust_bridge_codegen. A guard below fails the run if
# Rust-side sources changed after PREBUILT_BASE, so a stale lib is never shipped.
#
# One-time Apple-side setup (already done, kept here for reference):
#   - App ID `com.thinhnnd.rustdesk` and app "RustDesk Gold" on App Store Connect
#   - `iPhone Distribution` certificate (id FN4CUVRV47) exported to IOS_DIST_P12_BASE64
#   - App Store provisioning profile `rustdesk-gold-app-store` in IOS_PROVISIONING_PROFILE_BASE64
#   - App Store Connect API key in APP_STORE_CONNECT_*
#
# Manual signing is used (see Release build settings in flutter/ios and
# flutter/ios/exportOptions.plist) so no Apple portal calls happen at build time.

name: iOS TestFlight

on:
  push:
    branches:
      - master
      - ci/ios-testflight
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  # Do not cancel: a late push killing an in-flight TestFlight upload wastes the
  # whole run and can leave a partial upload in Apple's pipeline.
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.35.5"
  # Commit that produced prebuilt/ios/liblibrustdesk.a.gz. Update this when the
  # prebuilt library is regenerated.
  PREBUILT_BASE: "995dbd936eadd94f66fc0b4bf3315a804694833e"

jobs:
  build-ios-testflight:
    name: build and upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the prebuilt-lib freshness check can diff against
          # PREBUILT_BASE.
          fetch-depth: 0

      - name: Verify prebuilt Rust core is current
        run: |
          CHANGED=$(git diff --name-only ${{ env.PREBUILT_BASE }} HEAD -- \
            src/ libs/ Cargo.toml Cargo.lock build.rs res/vcpkg res/vcpkg-triplets vcpkg.json)
          if [ -n "$CHANGED" ]; then
            echo "Rust-side sources changed since the prebuilt lib was made:"
            echo "$CHANGED"
            echo "Rebuild prebuilt/ios/liblibrustdesk.a.gz (and update PREBUILT_BASE),"
            echo "or extend this workflow to build the Rust core from source."
            exit 1
          fi

      - name: Unpack prebuilt Rust core
        run: |
          mkdir -p target/aarch64-apple-ios/release
          gunzip -c prebuilt/ios/liblibrustdesk.a.gz > target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Import the distribution certificate
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          keychain: rustdesk

      - name: Install the provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > /tmp/app-store.mobileprovision
          security cms -D -i /tmp/app-store.mobileprovision -o /tmp/app-store-profile.plist
          PROFILE_UUID=$(plutil -extract UUID raw /tmp/app-store-profile.plist)
          mv /tmp/app-store.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Build and sign IPA
        run: |
          pushd flutter
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/exportOptions.plist
          popd

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file flutter/build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Distribute build to internal TestFlight group
        run: |
          python3 -m venv /tmp/ascenv
          /tmp/ascenv/bin/pip install --quiet pyjwt cryptography
          /tmp/ascenv/bin/python <<'PY'
          import json, time, urllib.request
          import jwt

          APP_ID = "6833731204"
          GROUP_ID = "c981bf7f-5e4e-4628-8ada-715e8f5e34e7"
          BUILD_NUMBER = "${{ github.run_number }}"
          BASE = "https://api.appstoreconnect.apple.com/v1"

          def api(method, path, body=None):
              token = jwt.encode(
                  {"iss": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
                   "iat": int(time.time()), "exp": int(time.time()) + 900,
                   "aud": "appstoreconnect-v1"},
                  open(f"/Users/runner/private_keys/AuthKey_{key_id}.p8").read(),
                  algorithm="ES256", headers={"kid": key_id})
              req = urllib.request.Request(
                  BASE + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          key_id = "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"

          build_id = None
          for _ in range(30):
              _, data = api("GET", f"/builds?filter[app]={APP_ID}"
                                   f"&filter[version]={BUILD_NUMBER}&limit=1")
              if data.get("data"):
                  build_id = data["data"][0]["id"]
                  state = data["data"][0]["attributes"].get("processingState")
                  if state == "VALID":
                      break
                  if state == "FAILED" or state == "INVALID":
                      raise SystemExit(f"Build {build_id} processing state: {state}")
              time.sleep(20)
          if not build_id:
              raise SystemExit("Uploaded build never appeared in App Store Connect")

          for _ in range(10):
              status, _ = api(
                  "POST", f"/betaGroups/{GROUP_ID}/relationships/builds",
                  {"data": [{"type": "builds", "id": build_id}]})
              if status in (200, 201, 204):
                  print(f"Build {build_id} assigned to Internal Testers")
                  break
              time.sleep(20)
          else:
              raise SystemExit("Could not assign build to Internal Testers group")
          PY

      - name: Upload IPA artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ios-ipa
          path: flutter/build/ios/ipa/*.ipa
          if-no-files-found: ignore
