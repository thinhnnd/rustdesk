# Build the iOS/iPadOS IPA and upload it to TestFlight.
#
# One-time Apple-side setup (already done, kept here for reference):
#   - App ID `com.thinhnnd.rustdesk` and app "RustDesk Gold" on App Store Connect
#   - `iPhone Distribution` certificate (id FN4CUVRV47) exported to IOS_DIST_P12_BASE64
#   - App Store provisioning profile `rustdesk-gold-app-store` in IOS_PROVISIONING_PROFILE_BASE64
#   - App Store Connect API key in APP_STORE_CONNECT_*
#
# Manual signing is used (see Release build settings in flutter/ios and
# flutter/ios/exportOptions.plist) so no Apple portal calls happen at build time.

name: iOS TestFlight

on:
  push:
    branches:
      - master
      - ci/ios-testflight
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  # Do not cancel: a late push killing an in-flight TestFlight upload wastes the
  # whole run and can leave a partial upload in Apple's pipeline.
  cancel-in-progress: false

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_CMAKE_VERSION: "4.3.0"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-ios-testflight:
    name: build and upload to TestFlight
    needs: [generate-bridge]
    runs-on: macos-latest
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-ios-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Import the distribution certificate
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          keychain: rustdesk

      - name: Install the provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > /tmp/app-store.mobileprovision
          security cms -D -i /tmp/app-store.mobileprovision -o /tmp/app-store-profile.plist
          PROFILE_UUID=$(plutil -extract UUID raw /tmp/app-store-profile.plist)
          mv /tmp/app-store.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Build and sign IPA
        run: |
          pushd flutter
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/exportOptions.plist
          popd

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file flutter/build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload IPA artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ios-ipa
          path: flutter/build/ios/ipa/*.ipa
          if-no-files-found: ignore
